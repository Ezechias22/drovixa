services:
  - type: keyvalue
    name: drovixa-redis
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: drovixa-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    preDeployCommand: alembic upgrade head
    initialDeployHook: python -m app.scripts.bootstrap_superuser
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVICE_ROLE
        value: api
      - key: RELEASE
        value: drovixa@0.13.0
      - key: DEBUG
        value: "false"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUSTED_HOSTS
        value: '["*.onrender.com","drovixa-api","localhost"]'
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: drovixa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: drovixa-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: drovixa-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: drovixa-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: FIRST_SUPERUSER_EMAIL
        sync: false
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false
      - key: FIRST_SUPERUSER_NAME
        value: Drovixa Owner
      - key: VIDEO_PROVIDER
        value: mux
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_SIGNING_KEY_ID
        sync: false
      - key: MUX_SIGNING_PRIVATE_KEY_B64
        sync: false
      - key: MUX_WEBHOOK_SECRET
        sync: false
      - key: MUX_UPLOAD_CORS_ORIGIN
        sync: false
      - key: PUSH_PROVIDER
        value: firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: FIREBASE_DRY_RUN
        value: "false"
      - key: PUSH_BATCH_SIZE
        value: "500"
      - key: ADMOB_ANDROID_REWARDED_AD_UNIT_ID
        sync: false
      - key: ADMOB_IOS_REWARDED_AD_UNIT_ID
        sync: false
      - key: ENGAGEMENT_AUTOMATION_ENABLED
        value: "true"
      - key: PAYMENT_PROVIDER
        value: disabled

  - type: worker
    name: drovixa-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: celery -A app.workers.celery_app:celery_app worker --beat --loglevel=INFO --concurrency=2
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVICE_ROLE
        value: worker
      - key: RELEASE
        value: drovixa-worker@0.13.0
      - key: DEBUG
        value: "false"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUSTED_HOSTS
        value: '["*.onrender.com","localhost"]'
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: drovixa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: drovixa-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: drovixa-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: drovixa-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: METRICS_ENABLED
        value: "false"
      - key: PUSH_PROVIDER
        value: firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: FIREBASE_DRY_RUN
        value: "false"
      - key: PUSH_BATCH_SIZE
        value: "500"
      - key: ENGAGEMENT_AUTOMATION_ENABLED
        value: "true"

  - type: web
    name: drovixa-web
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: .
    dockerfilePath: ./web/Dockerfile
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: drovixa-api
          property: hostport
      - key: NEXT_PUBLIC_API_URL
        value: /api/drovixa
      - key: RELEASE
        value: drovixa-web@0.13.0

  - type: web
    name: drovixa-admin
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: .
    dockerfilePath: ./admin/Dockerfile
    healthCheckPath: /login
    autoDeployTrigger: checksPass
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: drovixa-api
          property: hostport
      - key: ADMIN_COOKIE_SECURE
        value: "true"
      - key: RELEASE
        value: drovixa-admin@0.13.0

databases:
  - name: drovixa-postgres
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: drovixa
    user: drovixa
    ipAllowList: []
