name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DATABASE_URL: postgresql+asyncpg://drovixa:drovixa_ci_password@localhost:5432/drovixa_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-jwt-secret-that-is-long-enough-123456789
      REFRESH_SECRET: ci-refresh-secret-that-is-different-987654321
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: drovixa_ci
          POSTGRES_USER: drovixa
          POSTGRES_PASSWORD: drovixa_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drovixa -d drovixa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations
      - run: mypy app
      - run: pytest -q -o addopts='' -W error --cov=app --cov-report=term-missing --cov-fail-under=65
      - run: alembic upgrade head
      - run: alembic check
