name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Mobile platform
        type: choice
        options: [all, android, ios]
        default: all
      submit:
        description: Submit after build
        type: boolean
        default: false
      confirm:
        description: Type BUILD DROVIXA MOBILE
        required: true

permissions:
  contents: read

concurrency:
  group: drovixa-mobile-production
  cancel-in-progress: false

jobs:
  eas:
    if: ${{ inputs.confirm == 'BUILD DROVIXA MOBILE' }}
    runs-on: ubuntu-latest
    environment: mobile-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify mobile release candidate
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.PRODUCTION_API_URL }}
          EXPO_PUBLIC_APP_ENV: production
          EXPO_NO_TELEMETRY: "1"
        run: |
          test -n "$EXPO_PUBLIC_API_URL"
          npm run typecheck --workspace @drovixa/mobile
          npm exec --workspace @drovixa/mobile -- expo config --type public
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed binaries
        working-directory: mobile
        run: eas build --platform "${{ inputs.platform }}" --profile production --non-interactive --no-wait
      - name: Submit latest builds
        if: ${{ inputs.submit }}
        working-directory: mobile
        run: eas submit --platform "${{ inputs.platform }}" --profile production --latest --non-interactive
